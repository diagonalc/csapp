<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Tiny 表单测试</title>
</head>

<body>
    <h2>用户注册表单</h2>

    <!-- action 填接收数据的服务器地址，method 填请求方式 -->
    <form action="/cgi-bin/adder" method="GET">

        <!-- 1. 数字/文本输入框 -->
        <label for="first">第一个数字:</label>
        <input type="number" id="first" name="first_num" placeholder="请输入数字">
        <br><br>

        <label for="second">第二个数字:</label>
        <input type="number" id="second" name="second_num" placeholder="请输入数字">
        <br><br>

        <!-- 2. 单选框 (Radio) -->
        <label>性别:</label>
        <input type="radio" id="male" name="gender" value="m">
        <label for="male">男</label>
        <input type="radio" id="female" name="gender" value="f">
        <label for="female">女</label>
        <br><br>

        <!-- 3. 下拉菜单 (Select) -->
        <label for="city">城市:</label>
        <select id="city" name="city">
            <option value="beijing">北京</option>
            <option value="shanghai">上海</option>
        </select>
        <br><br>

        <!-- 4. 提交按钮 -->
        <button type="submit">提交给服务器</button>
    </form>
</body>

</html>
