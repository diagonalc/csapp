<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Tiny Adder</title>
</head>

<body>
    <h2>Adder</h2>

    
    <form action="/cgi-bin/adder" method="POST">

        <label for="first">First Number:</label>
        <input type="number" id="first" name="first_num">
        <br><br>

        <label for="second">Second Number:</label>
        <input type="number" id="second" name="second_num">
        <br><br>

        <button type="submit">Submit</button>
    </form>
</body>

</html>
